<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #1a1f2e;
            --bg-secondary: #242938;
            --bg-tertiary: #2d3344;
            --text-primary: #f0f4f8;
            --text-secondary: #94a3b8;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --border: #3d4555;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 360px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .sidebar-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        /* Search */
        .search-box {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .search-input:focus {
            border-color: var(--accent);
        }
        
        .search-input::placeholder {
            color: var(--text-secondary);
        }
        
        /* Filters */
        .filters {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .filters-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .filter-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-primary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            background: var(--bg-primary);
        }
        
        .filter-btn.active {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.1);
        }
        
        .filter-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .filter-count {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }
        
        /* Sort */
        .sort-box {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .sort-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .sort-select {
            flex: 1;
            padding: 6px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }
        
        /* Mountain List */
        .mountain-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        
        .mountain-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 3px solid transparent;
        }
        
        .mountain-item:hover {
            background: var(--bg-tertiary);
        }
        
        .mountain-item.selected {
            background: var(--bg-tertiary);
            border-left-color: var(--accent);
        }
        
        .mountain-marker {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .mountain-info {
            flex: 1;
            min-width: 0;
        }
        
        .mountain-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .mountain-meta {
            display: flex;
            gap: 12px;
            margin-top: 2px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .mountain-elevation {
            font-weight: 600;
            color: var(--accent);
            font-size: 0.85rem;
        }
        
        /* Stats */
        .stats {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg-tertiary);
        }
        
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }
        
        .stats-label {
            color: var(--text-secondary);
        }
        
        .stats-value {
            font-weight: 600;
        }
        
        /* Map Container */
        .map-container {
            flex: 1;
            position: relative;
        }
        
        #map {
            height: 100%;
            width: 100%;
        }
        
        /* Legend */
        .map-legend {
            position: absolute;
            bottom: 30px;
            right: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            z-index: 1000;
            font-size: 0.8rem;
        }
        
        .legend-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        /* Mobile Toggle */
        .mobile-toggle {
            display: none;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1001;
            width: 44px;
            height: 44px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 1002;
                transform: translateX(-100%);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .mobile-toggle {
                display: flex;
            }
            
            .sidebar-open .mobile-toggle {
                left: 370px;
            }
        }
        
        /* Custom Leaflet Popup */
        .leaflet-popup-content-wrapper {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 8px;
        }
        
        .leaflet-popup-content {
            margin: 12px 16px;
        }
        
        .leaflet-popup-tip {
            background: var(--bg-secondary);
        }
        
        .popup-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 8px;
        }
        
        .popup-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        
        .popup-elevation {
            color: var(--accent);
            font-weight: 600;
        }
    </style>
</head>

                <h1>台灣百名山</h1>
                <p>Taiwan 100 Mountains</p>
            </div>
            
            <div class="search-box">

            </div>

            {id: "092", name: "新康山", h: 3331, type: "百岳", lat: 23.333, lng: 121.133},
            {id: "093", name: "成廣澳山", h: 1598, type: "中級山", lat: 23.167, lng: 121.350},
            {id: "094", name: "新港山", h: 1682, type: "中級山", lat: 23.133, lng: 121.317},
            {id: "095", name: "美奈田主山", h: 2931, type: "中級山", lat: 22.950, lng: 120.933},
            {id: "096", name: "都蘭山", h: 1190, type: "小百岳", lat: 22.883, lng: 121.183},
            {id: "097", name: "火燒山", h: 280, type: "郊山", lat: 22.667, lng: 121.483},
            {id: "098", name: "太麻里山", h: 1340, type: "小百岳", lat: 22.633, lng: 120.967},
            {id: "099", name: "紅頭山", h: 552, type: "小百岳", lat: 22.050, lng: 121.550},
            {id: "100", name: "太武山", h: 253, type: "小百岳", lat: 24.461, lng: 118.426}
        ];

        // Type colors
        const typeColors = {
            '百岳': '#ef4444',
            '小百岳': '#22c55e',
            '中級山': '#3b82f6',
            '高山': '#a855f7',
            '郊山': '#6b7280'
        };

        // State
        let activeFilters = new Set(['百岳', '小百岳', '中級山', '高山', '郊山']);
        let searchQuery = '';
        let sortBy = 'id';
        let selectedMountainId = null;
        let markers = {};

        // Initialize map
        const map = L.map('map').setView([23.7, 120.95], 8);
        
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: '&copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
        }).addTo(map);

        // Get filtered mountains
        function getFilteredMountains() {
            let filtered = mountains.filter(m => {
                const matchesFilter = activeFilters.has(m.type);
                const matchesSearch = searchQuery === '' || 
                    m.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    m.id.includes(searchQuery);
                return matchesFilter && matchesSearch;
            });

            // Sort
            filtered.sort((a, b) => {
                switch (sortBy) {
                    case 'height-desc': return b.h - a.h;
                    case 'height-asc': return a.h - b.h;
                    case 'name': return a.name.localeCompare(b.name, 'zh-TW');
                    default: return a.id.localeCompare(b.id);
                }
            });

            return filtered;
        }

        // Render filter buttons
        function renderFilters() {
            const container = document.getElementById('filterButtons');
            const types = ['百岳', '小百岳', '中級山', '高山', '郊山'];
            
            container.innerHTML = types.map(type => {
                const count = mountains.filter(m => m.type === type).length;
                const isActive = activeFilters.has(type);
                return `
                    <button class="filter-btn ${isActive ? 'active' : ''}" data-type="${type}">
                        <span class="filter-dot" style="background:${typeColors[type]}"></span>
                        ${type}
                        <span class="filter-count">(${count})</span>
                    </button>
                `;
            }).join('');

            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.dataset.type;
                    if (activeFilters.has(type)) {
                        activeFilters.delete(type);
                    } else {
                        activeFilters.add(type);
                    }
                    renderFilters();
                    renderList();
                    updateMarkers();
                });
            });
        }

        // Render mountain list
        function renderList() {
            const container = document.getElementById('mountainList');
            const filtered = getFilteredMountains();

            container.innerHTML = filtered.map(m => `
                <div class="mountain-item ${selectedMountainId === m.id ? 'selected' : ''}" data-id="${m.id}">
                    <span class="mountain-marker" style="background:${typeColors[m.type]}"></span>
                    <div class="mountain-info">
                        <div class="mountain-name">${m.id} ${m.name}</div>
                        <div class="mountain-meta">
                            <span>${m.type}</span>
                        </div>
                    </div>
                    <span class="mountain-elevation">${m.h}m</span>
                </div>
            `).join('');

            container.querySelectorAll('.mountain-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.dataset.id;
                    const mountain = mountains.find(m => m.id === id);
                    if (mountain) {
                        selectMountain(mountain);
                    }
                });
            });

            // Update stats
            const highest = filtered.reduce((max, m) => m.h > max.h ? m : max, filtered[0] || {h: 0, name: '-'});
            document.getElementById('stats').innerHTML = `
                <div class="stats-row">
                    <span class="stats-label">顯示</span>
                    <span class="stats-value">${filtered.length} / ${mountains.length} 座</span>
                </div>
                <div class="stats-row" style="margin-top:4px">
                    <span class="stats-label">最高峰</span>
                    <span class="stats-value">${highest.name || '-'} (${highest.h}m)</span>
                </div>
            `;
        }

        // Create markers
        function createMarkers() {
            mountains.forEach(m => {
                const marker = L.circleMarker([m.lat, m.lng], {
                    radius: 8,
                    fillColor: typeColors[m.type],
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                });

                marker.bindPopup(`
                    <div class="popup-title">${m.id} ${m.name}</div>
                    <div class="popup-info">
                        海拔：<span class="popup-elevation">${m.h}m</span><br>
                        類型：${m.type}
                    </div>
                `);

                marker.bindTooltip(`${m.id} ${m.name}`, {
                    permanent: false,
                    direction: 'top',
                    offset: [0, -8]
                });

                marker.on('click', () => selectMountain(m));
                markers[m.id] = marker;
                marker.addTo(map);
            });
        }

        // Update marker visibility
        function updateMarkers() {
            const filtered = getFilteredMountains();
            const filteredIds = new Set(filtered.map(m => m.id));

            Object.entries(markers).forEach(([id, marker]) => {
                if (filteredIds.has(id)) {
                    marker.addTo(map);
                } else {
                    marker.remove();
                }
            });
        }

        // Select mountain
        function selectMountain(mountain) {
            selectedMountainId = mountain.id;
            map.flyTo([mountain.lat, mountain.lng], 12, { duration: 1 });
            markers[mountain.id].openPopup();
            renderList();
            
            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderList();
            updateMarkers();
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            sortBy = e.target.value;
            renderList();
        });

        document.getElementById('mobileToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });

        // Initialize
        renderFilters();
        renderList();
        createMarkers();
    </script>
</body>
</html>
